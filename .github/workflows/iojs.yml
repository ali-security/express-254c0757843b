name: iojs-ci

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated mocha test files to run instead of the full suite'
        required: false
        default: ''

concurrency:
  group: "${{ github.workflow }} ✨ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["1.8", "2.5", "3.3"]
        include:
          - node-version: "1.8"
            npm-i: "mocha@3.5.3 nyc@10.3.2 supertest@2.0.0"
          - node-version: "2.5"
            npm-i: "mocha@3.5.3 nyc@10.3.2 supertest@2.0.0"
          - node-version: "3.3"
            npm-i: "mocha@3.5.3 nyc@10.3.2 supertest@2.0.0"

    steps:
    - uses: actions/checkout@v4

    - name: Install iojs ${{ matrix.node-version }}
      shell: bash -eo pipefail -l {0}
      run: |
        nvm install --default ${{ matrix.node-version }}
        dirname "$(nvm which ${{ matrix.node-version }})" >> "$GITHUB_PATH"

    - name: Configure npm
      run: |
        npm config set loglevel error
        npm config set shrinkwrap false

    - name: Install npm module(s) ${{ matrix.npm-i }}
      run: npm install --save-dev ${{ matrix.npm-i }}
      if: matrix.npm-i != ''

    - name: Remove non-test dependencies
      run: npm rm --silent --save-dev connect-redis

    - name: Install Node.js dependencies
      run: npm install

    - name: List environment
      id: list_env
      shell: bash
      run: |
        echo "node@$(node -v)"
        echo "npm@$(npm -v)"
        npm -s ls ||:
        (npm -s ls --depth=0 ||:) | awk -F'[ @]' 'NR>1 && $2 { print $2 "=" $3 }' >> "$GITHUB_OUTPUT"

    - name: Run tests
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          ./node_modules/.bin/mocha --require test/support/env --reporter spec --check-leaks ${{ inputs.test-filter }}
        else
          npm run test
        fi
        echo "=== Skipped (pending) test report ==="
        node -e 'var m = +process.versions.node.split(".")[0]; var als = false; try { als = typeof require("async_hooks").AsyncLocalStorage === "function" } catch (e) {} console.log("Node " + process.version + ":"); console.log("SKIP app.router \"should not support GET without a path\": app.get(name) with one argument is the settings getter, so the no-path check does not apply to GET (skipped on every Node version, test/app.router.js)"); if (m < 22) console.log("SKIP QUERY-method tests (app.router include/without-path QUERY, res.send ETag QUERY): Node < 22 has no HTTP QUERY method (shouldSkipQuery in test/support/utils.js)"); if (!als) console.log("SKIP async local storage describe blocks (express.json/raw/text/urlencoded, res.download, res.sendFile): async_hooks.AsyncLocalStorage is not available on this Node version")'

